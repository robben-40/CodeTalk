[project]
name = "codetalk-backend"
version = "0.1.0"
description = "CodeTalk local real-time ASR and smart note summarizer backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "faster-whisper>=1.0.3",
    "numpy>=1.26.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
audio = [
    "silero-vad>=5.1.2",
    "onnxruntime>=1.18.0",
    "scipy>=1.13.0",
]
llm = [
    "google-genai>=0.3.0",
    "openai>=1.50.0",
]
eval = [
    "jiwer>=3.0.4",
]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
