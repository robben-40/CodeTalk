[project]
name = "codetalk-backend"
version = "0.1.0"
description = "CodeTalk local real-time ASR and smart note summarizer backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "faster-whisper>=1.0.3",
    "numpy>=1.26.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
